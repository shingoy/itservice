        const SYNONYMS = {

        const PRESET_URLS = [
          'https://www.digital.go.jp/councils/',
          'https://www.digital.go.jp/meeting/dh-promotion/',
          'https://www.digital.go.jp/meeting/data-strategy/',

        function App() {
          const [docs, setDocs] = useState([]);
          const [searchTerm, setSearchTerm] = useState('');
          const [selectedMinistry, setSelectedMinistry] = useState('全て');
          const [selectedType, setSelectedType] = useState('全て');
          const [selectedYear, setSelectedYear] = useState('全て');
          const [sortBy, setSortBy] = useState('date-desc');
          const [selectedDoc, setSelectedDoc] = useState(null);
          const [apiKey, setApiKey] = useState('');
          const [showSettings, setShowSettings] = useState(false);
          const [summary, setSummary] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [toast, setToast] = useState(null);
          const [jsonUrl, setJsonUrl] = useState('');
          const [aiProvider, setAiProvider] = useState('anthropic');
          const [showScraper, setShowScraper] = useState(false);
          const [scrapeUrls, setScrapeUrls] = useState(['']);
          const [scrapingProgress, setScrapingProgress] = useState([]);
          const [isScraping, setIsScraping] = useState(false);
          const [abortController, setAbortController] = useState(null);
          const [completedDocs, setCompletedDocs] = useState([]);

          useEffect(() => {
            const savedKey = localStorage.getItem('apiKey');
            const savedProvider = localStorage.getItem('aiProvider');
            if (savedKey) setApiKey(savedKey);
            if (savedProvider) setAiProvider(savedProvider);
          }, []);

          const showToast = (message, type = 'info') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3000);
          };

          const loadSampleData = () => {
            setDocs(SAMPLE_DATA.docs);
            showToast('サンプルデータを読み込みました', 'success');
          };

          const loadJsonFromUrl = async () => {
            if (!jsonUrl) {
              showToast('URLを入力してください', 'error');
              return;
            }
            setIsLoading(true);
            try {
              const response = await fetch(jsonUrl);
              const data = await response.json();
              if (data.docs && Array.isArray(data.docs)) {
                setDocs(data.docs);
                showToast(data.docs.length + '件のドキュメントを読み込みました', 'success');
              } else {
                showToast('無効なJSON形式です', 'error');
              }
            } catch (error) {
              showToast('読み込みに失敗しました: ' + error.message, 'error');
            } finally {
              setIsLoading(false);
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (data.docs && Array.isArray(data.docs)) {
                  setDocs(data.docs);
                  showToast(data.docs.length + '件のドキュメントを読み込みました', 'success');
                } else {
                  showToast('無効なJSON形式です', 'error');
                }
              } catch (error) {
                showToast('JSONの解析に失敗しました', 'error');
              }
            };
            reader.readAsText(file);
          };

          const scrapeWithVercel = async (url, index, signal) => {
            try {
              if (signal && signal.aborted) {
                throw new Error('Aborted');
              }

              setScrapingProgress(prev => {
                const newProgress = [...prev];
                newProgress[index] = { url, status: 'fetching', message: 'ページ取得中...' };
                return newProgress;
              });

              const apiEndpoint = '/api/scrape?url=' + encodeURIComponent(url);
              
              const response = await fetch(apiEndpoint, {
                method: 'GET',
                signal: signal
              });

              if (signal && signal.aborted) {
                throw new Error('Aborted');
              }

              if (!response.ok) {
                throw new Error('API Error: ' + response.status);
              }

              const extractedData = await response.json();

              if (extractedData.error) {
                throw new Error(extractedData.error);
              }

              setScrapingProgress(prev => {
                const newProgress = [...prev];
                newProgress[index] = { url, status: 'parsing', message: '内容を解析中...' };
                return newProgress;
              });

              const newDoc = {
                id: 'scraped-' + Date.now() + '-' + index,
                title: extractedData.title || 'タイトル不明',
                council: extractedData.council || '会議名不明',
                ministry: extractedData.ministry || '省庁不明',
                date: extractedData.date || new Date().toISOString().split('T')[0],
                type: extractedData.type || '議事録',
                format: extractedData.format || 'html',
                url: extractedData.url || url,
                summary: extractedData.summary || '要約なし',
                text: extractedData.text || '本文なし',
                sourceUrl: url,
                scrapedAt: new Date().toISOString()
              };

              setScrapingProgress(prev => {
                const newProgress = [...prev];
                newProgress[index] = { url, status: 'success', message: '完了: ' + newDoc.title.substring(0, 30), doc: newDoc };
                return newProgress;
              });

              setCompletedDocs(prev => [...prev, newDoc]);

              return newDoc;
            } catch (error) {
              if (error.message === 'Aborted' || error.name === 'AbortError') {
                setScrapingProgress(prev => {
                  const newProgress = [...prev];
                  newProgress[index] = { url, status: 'cancelled', message: '中断されました' };
                  return newProgress;
                });
                return null;
              }

              const errorDoc = {
                id: 'error-' + Date.now() + '-' + index,
                title: 'エラー: ' + url,
                council: 'データ取得失敗',
                ministry: '不明',
                date: new Date().toISOString().split('T')[0],
                type: 'その他',
                format: 'html',
                url: url,
                summary: 'データ取得時にエラーが発生しました: ' + error.message,
                text: 'APIエラー。Vercel APIが正しくデプロイされているか確認してください。',
                sourceUrl: url,
                scrapedAt: new Date().toISOString()
              };
              
              setScrapingProgress(prev => {
                const newProgress = [...prev];
                newProgress[index] = { url, status: 'error', message: 'エラー: ' + error.message };
                return newProgress;
              });
              
              return errorDoc;
            }
          };

          const startScraping = async () => {
            const validUrls = scrapeUrls.filter(url => url.trim() !== '');
            if (validUrls.length === 0) {
              showToast('URLを入力してください', 'error');
              return;
            }

            setIsScraping(true);
            setCompletedDocs([]);
            setScrapingProgress(validUrls.map(url => ({ url, status: 'waiting', message: '待機中...' })));

            const controller = new AbortController();
            setAbortController(controller);

            try {
              const CONCURRENT_LIMIT = 3;
              const results = [];
              
              for (let i = 0; i < validUrls.length; i += CONCURRENT_LIMIT) {
                if (controller.signal.aborted) break;
                
                const batch = validUrls.slice(i, i + CONCURRENT_LIMIT);
                const batchPromises = batch.map((url, batchIndex) => 
                  scrapeWithVercel(url, i + batchIndex, controller.signal)
                );
                
                const batchResults = await Promise.all(batchPromises);
                results.push(...batchResults);
                
                if (i + CONCURRENT_LIMIT < validUrls.length && !controller.signal.aborted) {
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }

              const newDocs = results.filter(doc => doc !== null);
              setCompletedDocs(newDocs);

              if (newDocs.length > 0 && !controller.signal.aborted) {
                setDocs(prev => [...prev, ...newDocs]);
                showToast(newDocs.length + '件のドキュメントを追加しました', 'success');
              }
            } catch (error) {
              if (error.name !== 'AbortError') {
                showToast('エラーが発生しました: ' + error.message, 'error');
              }
            } finally {
              setIsScraping(false);
              setAbortController(null);
            }
          };

          const stopScraping = () => {
            if (abortController) {
              abortController.abort();
              showToast('処理を中断しました', 'info');
            }
            setIsScraping(false);
          };

          const saveCompletedDocs = () => {
            if (completedDocs.length > 0) {
              setDocs(prev => [...prev, ...completedDocs]);
              showToast(completedDocs.length + '件のドキュメントを追加しました', 'success');
              setCompletedDocs([]);
              setScrapingProgress([]);
            } else {
              showToast('格納するデータがありません', 'error');
            }
          };

          const addUrlField = () => {
            setScrapeUrls([...scrapeUrls, '']);
          };

          const removeUrlField = (index) => {
            setScrapeUrls(scrapeUrls.filter((_, i) => i !== index));
          };

          const updateUrlField = (index, value) => {
            const newUrls = [...scrapeUrls];
            newUrls[index] = value;
            setScrapeUrls(newUrls);
          };

          const loadPresetUrls = () => {
            setScrapeUrls(PRESET_URLS);
            showToast(PRESET_URLS.length + '個の政府IT会議URLを読み込みました', 'success');
          };

          const filteredDocs = useMemo(() => {
            let results = [...docs];

            if (selectedMinistry !== '全て') {
              results = results.filter(doc => doc.ministry === selectedMinistry);
            }

            if (selectedType !== '全て') {
              results = results.filter(doc => doc.type === selectedType);
            }

            if (selectedYear !== '全て') {
              results = results.filter(doc => doc.date && doc.date.startsWith(selectedYear));
            }

            if (searchTerm) {
              const searchTerms = [searchTerm.toLowerCase()];
              Object.keys(SYNONYMS).forEach(key => {
                if (searchTerm.includes(key)) {
                  searchTerms.push(...SYNONYMS[key].map(s => s.toLowerCase()));
                }
              });

              results = results.filter(doc => {
                const searchableText = (doc.title + ' ' + doc.text + ' ' + doc.summary).toLowerCase();
                return searchTerms.some(term => searchableText.includes(term));
              });
            }

            if (sortBy === 'date-desc') {
              results.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            } else if (sortBy === 'date-asc') {
              results.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            }

            return results;
          }, [docs, searchTerm, selectedMinistry, selectedType, selectedYear, sortBy]);

          const ministries = useMemo(() => {
            const set = new Set(docs.map(doc => doc.ministry));
            return ['全て', ...Array.from(set).sort()];
          }, [docs]);

          const types = useMemo(() => {
            const set = new Set(docs.map(doc => doc.type));
            return ['全て', ...Array.from(set).sort()];
          }, [docs]);

          const years = useMemo(() => {
            const set = new Set(docs.map(doc => doc.date && doc.date.substring(0, 4)).filter(Boolean));
            return ['全て', ...Array.from(set).sort().reverse()];
          }, [docs]);

          const generateSummary = async () => {
            if (!apiKey) {
              showToast('APIキーを設定してください', 'error');
              setShowSettings(true);
              return;
            }

            if (!selectedDoc) return;

            setIsLoading(true);
            setSummary('');

            try {
              let response;
              
              const summaryPrompt = '以下の政府会議の議事録を要約してください。特に、政策的な論点、決定事項、今後の課題について簡潔にまとめてください。\n\nタイトル: ' + selectedDoc.title + '\n\n本文:\n' + selectedDoc.text;
              
              if (aiProvider === 'openai') {
                response = await fetch('https://api.openai.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [{ role: 'user', content: summaryPrompt }],
                    max_tokens: 500
                  })
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                setSummary(data.choices[0].message.content);
              } else if (aiProvider === 'anthropic') {
                response = await fetch('https://api.anthropic.com/v1/messages', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    model: 'claude-sonnet-4-20250514',
                    max_tokens: 500,
                    messages: [{ role: 'user', content: summaryPrompt }]
                  })
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                setSummary(data.content[0].text);
              }
              
              showToast('要約を生成しました', 'success');
            } catch (error) {
              showToast('要約の生成に失敗しました: ' + error.message, 'error');
              setSummary('要約の生成に失敗しました。APIキーを確認してください。');
            } finally {
              setIsLoading(false);
            }
          };

          const exportToCsv = () => {
            if (filteredDocs.length === 0) {
              showToast('エクスポートするデータがありません', 'error');
              return;
            }

            const headers = ['ID', 'タイトル', '会議名', '省庁', '日付', 'タイプ', 'URL', '要約'];
            const rows = filteredDocs.map(doc => [
              doc.id, doc.title, doc.council, doc.ministry,
              doc.date, doc.type, doc.url, doc.summary
            ]);

            const csv = [headers, ...rows].map(row => 
              row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')
            ).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'gov-it-dashboard-' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
            showToast('CSVファイルをダウンロードしました', 'success');
          };

          const exportToJson = () => {
            if (docs.length === 0) {
              showToast('エクスポートするデータがありません', 'error');
              return;
            }

            const exportData = {
              meta: { built_at: new Date().toISOString(), source_count: docs.length },
              docs: docs
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'gov-it-dashboard-' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            showToast('JSONファイルをダウンロードしました', 'success');
          };

          const saveApiKey = () => {
            localStorage.setItem('apiKey', apiKey);
            localStorage.setItem('aiProvider', aiProvider);
            showToast('設定を保存しました', 'success');
            setShowSettings(false);
          };

          return (
            <div className="min-h-screen bg-gray-50">
              <header className="bg-blue-600 text-white shadow-lg">
                <div className="container mx-auto px-4 py-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h1 className="text-3xl font-bold">政府IT会議ダッシュボード</h1>
                      <p className="text-blue-100 mt-1">v2.3 - 横断検索・要約・データ収集ツール</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="flex items-center gap-2 bg-blue-700 px-3 py-2 rounded">
                        {docs.length > 0 ? (
                          <React.Fragment>
                            <CheckCircle size={16} className="text-green-400" />
                            <span className="text-sm">{docs.length}件</span>
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            <AlertCircle size={16} className="text-yellow-400" />
                            <span className="text-sm">データなし</span>
                          </React.Fragment>
                        )}
                      </div>
                      <button
                        onClick={() => setShowSettings(!showSettings)}
                        className="bg-blue-700 hover:bg-blue-800 p-2 rounded"
                      >
                        <Settings size={20} />
                      </button>
                    </div>
                  </div>
                </div>
              </header>

              {toast && (
                <div className={'fixed top-4 right-4 px-6 py-3rounded shadow-lg z-50 text-white ' + (
                  toast.type === 'success' ? 'bg-green-500' :
                  toast.type === 'error' ? 'bg-red-500' : 'bg-blue-500'
                )}>
                  {toast.message}
                </div>
              )}

              {showSettings && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40">
                  <div className="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                    <h3 className="text-xl font-bold mb-4">API設定</h3>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium mb-2">AIプロバイダー</label>
                        <select
                          value={aiProvider}
                          onChange={(e) => setAiProvider(e.target.value)}
                          className="w-full p-2 border rounded"
                        >
                          <option value="anthropic">Anthropic (Claude)</option>
                          <option value="openai">OpenAI (GPT-4)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium mb-2">APIキー</label>
                        <input
                          type="password"
                          value={apiKey}
                          onChange={(e) => setApiKey(e.target.value)}
                          placeholder="sk-ant-... or sk-..."
                          className="w-full p-2 border rounded"
                        />
                        <p className="text-xs text-gray-500 mt-1">
                          ローカルストレージに保存されます
                        </p>
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={saveApiKey}
                          className="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
                        >
                          保存
                        </button>
                        <button
                          onClick={() => setShowSettings(false)}
                          className="flex-1 bg-gray-300 py-2 rounded hover:bg-gray-400"
                        >
                          キャンセル
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {showScraper && (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40 overflow-y-auto p-4">
                  <div className="bg-white rounded-lg p-6 max-w-3xl w-full my-8">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-xl font-bold">Webデータ収集</h3>
                      <button
                        onClick={() => setShowScraper(false)}
                        className="text-gray-500 hover:text-gray-700"
                      >
                        <X size={24} />
                      </button>
                    </div>

                    <div className="mb-4 p-4 bg-blue-50 rounded">
                      <p className="text-sm text-blue-800 mb-3">
                        政府サイトのURLを入力すると、Vercel APIが自動的にページ内容を取得・解析してデータベースに追加します。
                      </p>
                      <button
                        onClick={loadPresetUrls}
                        disabled={isScraping}
                        className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm disabled:bg-gray-400"
                      >
                        <FileText size={16} />
                        代表的な政府IT会議URL (20件) を読み込む
                      </button>
                    </div>

                    <div className="space-y-3 mb-4">
                      {scrapeUrls.map((url, index) => (
                        <div key={index} className="flex gap-2">
                          <input
                            type="text"
                            value={url}
                            onChange={(e) => updateUrlField(index, e.target.value)}
                            placeholder="https://www.digital.go.jp/..."
                            className="flex-1 p-2 border rounded"
                            disabled={isScraping}
                          />
                          {scrapeUrls.length > 1 && (
                            <button
                              onClick={() => removeUrlField(index)}
                              className="p-2 text-red-600 hover:bg-red-50 rounded"
                              disabled={isScraping}
                            >
                              <Trash2 size={20} />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={addUrlField}
                      className="flex items-center gap-2 text-blue-600 hover:bg-blue-50 px-3 py-2 rounded mb-4"
                      disabled={isScraping}
                    >
                      <Plus size={20} />
                      URL追加
                    </button>

                    {scrapingProgress.length > 0 && (
                      <div className="mb-4 max-h-60 overflow-y-auto space-y-2">
                        {scrapingProgress.map((progress, index) => (
                          <div key={index} className="p-3 bg-gray-50 rounded text-sm">
                            <div className="flex items-center gap-2 mb-1">
                              {progress.status === 'waiting' && <Loader size={16} className="text-gray-400" />}
                              {progress.status === 'fetching' && <Loader size={16} className="text-blue-600 animate-spin" />}
                              {progress.status === 'parsing' && <Loader size={16} className="text-purple-600 animate-spin" />}
                              {progress.status === 'success' && <CheckCircle size={16} className="text-green-600" />}
                              {progress.status === 'error' && <AlertCircle size={16} className="text-red-600" />}
                              <span className="font-medium truncate">{progress.url}</span>
                            </div>
                            <p className={'text-xs ' + (progress.status === 'error' ? 'text-red-600' : 'text-gray-600')}>
                              {progress.message}
                            </p>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="flex gap-2">
                      <button
                        onClick={startScraping}
                        disabled={isScraping}
                        className="flex-1 flex items-center justify-center gap-2 bg-green-600 text-white py-3 rounded hover:bg-green-700 disabled:bg-gray-400"
                      >
                        {isScraping ? (
                          <React.Fragment>
                            <Loader size={20} className="animate-spin" />
                            収集中...
                          </React.Fragment>
                        ) : (
                          <React.Fragment>
                            <Globe size={20} />
                            データ収集開始
                          </React.Fragment>
                        )}
                      </button>
                      {isScraping && (
                        <button
                          onClick={stopScraping}
                          className="px-6 bg-red-600 text-white py-3 rounded hover:bg-red-700"
                        >
                          中断
                        </button>
                      )}
                      {completedDocs.length > 0 && !isScraping && (
                        <button
                          onClick={saveCompletedDocs}
                          className="px-6 bg-blue-600 text-white py-3 rounded hover:bg-blue-700"
                        >
                          取得済み{completedDocs.length}件を格納
                        </button>
                      )}
                      {!isScraping && (
                        <button
                          onClick={() => setShowScraper(false)}
                          className="px-6 bg-gray-300 py-3 rounded hover:bg-gray-400"
                        >
                          閉じる
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}

              <div className="container mx-auto px-4 py-6">
                {docs.length === 0 && (
                  <div className="bg-white rounded-lg shadow p-6 mb-6">
                    <h2 className="text-xl font-bold mb-4">データを読み込む</h2>
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4">
                      <button
                        onClick={loadSampleData}
                        className="flex items-center justify-center gap-2 bg-green-600 text-white py-3 px-4 rounded hover:bg-green-700"
                      >
                        <FileText size={20} />
                        サンプルデータ
                      </button>
                      <button
                        onClick={() => setShowScraper(true)}
                        className="flex items-center justify-center gap-2 bg-orange-600 text-white py-3 px-4 rounded hover:bg-orange-700"
                      >
                        <Globe size={20} />
                        Web収集
                      </button>
                      <div>
                        <input
                          type="file"
                          accept=".json"
                          onChange={handleFileUpload}
                          className="hidden"
                          id="file-upload"
                        />
                        <label
                          htmlFor="file-upload"
                          className="flex items-center justify-center gap-2 bg-blue-600 text-white py-3 px-4 rounded hover:bg-blue-700 cursor-pointer h-full"
                        >
                          <Upload size={20} />
                          JSON
                        </label>
                      </div>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={jsonUrl}
                          onChange={(e) => setJsonUrl(e.target.value)}
                          placeholder="URL..."
                          className="flex-1 p-2 border rounded text-sm"
                        />
                        <button
                          onClick={loadJsonFromUrl}
                          disabled={isLoading}
                          className="bg-purple-600 text-white px-4 rounded hover:bg-purple-700 disabled:bg-gray-400"
                        >
                          {isLoading ? <Loader size={20} className="animate-spin" /> : '読込'}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {docs.length > 0 && (
                  <React.Fragment>
                    <div className="bg-white rounded-lg shadow p-6 mb-6">
                      <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div className="lg:col-span-2">
                          <div className="relative">
                            <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" size={20} />
                            <input
                              type="text"
                              value={searchTerm}
                              onChange={(e) => setSearchTerm(e.target.value)}
                              placeholder="キーワード検索 (例: 生成AI、マイナンバー、データ連携)"
                              className="w-full pl-10 pr-4 py-2 border rounded-lg"
                            />
                          </div>
                        </div>
                        <button
                          onClick={() => setShowScraper(true)}
                          className="flex items-center justify-center gap-2 bg-orange-600 text-white py-2 px-4 rounded-lg hover:bg-orange-700"
                        >
                          <Globe size={20} />
                          Web収集
                        </button>
                        <button
                          onClick={exportToCsv}
                          className="flex items-center justify-center gap-2 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700"
                        >
                          <Download size={20} />
                          CSV
                        </button>
                      </div>
                      
                      <div className="grid md:grid-cols-4 gap-4">
                        <div>
                          <label className="block text-sm font-medium mb-1">省庁</label>
                          <select
                            value={selectedMinistry}
                            onChange={(e) => setSelectedMinistry(e.target.value)}
                            className="w-full p-2 border rounded"
                          >
                            {ministries.map(m => <option key={m} value={m}>{m}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium mb-1">種別</label>
                          <select
                            value={selectedType}
                            onChange={(e) => setSelectedType(e.target.value)}
                            className="w-full p-2 border rounded"
                          >
                            {types.map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium mb-1">年度</label>
                          <select
                            value={selectedYear}
                            onChange={(e) => setSelectedYear(e.target.value)}
                            className="w-full p-2 border rounded"
                          >
                            {years.map(y => <option key={y} value={y}>{y}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium mb-1">並び順</label>
                          <select
                            value={sortBy}
                            onChange={(e) => setSortBy(e.target.value)}
                            className="w-full p-2 border rounded"
                          >
                            <option value="date-desc">新しい順</option>
                            <option value="date-asc">古い順</option>
                          </select>
                        </div>
                      </div>

                      <div className="mt-4 flex justify-between items-center">
                        <div className="text-sm text-gray-600">
                          {filteredDocs.length}件の結果
                        </div>
                        <button
                          onClick={exportToJson}
                          className="flex items-center gap-2 text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700"
                        >
                          <Download size={16} />
                          JSON出力
                        </button>
                      </div>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-6">
                      <div className="space-y-4">
                        {filteredDocs.map(doc => (
                          <div
                            key={doc.id}
                            onClick={() => {
                              setSelectedDoc(doc);
                              setSummary('');
                            }}
                            className={'bg-white rounded-lg shadow p-4 cursor-pointer transition ' + (
                              selectedDoc && selectedDoc.id === doc.id ? 'ring-2 ring-blue-500' : 'hover:shadow-lg'
                            )}
                          >
                            <div className="flex items-start justify-between mb-2">
                              <h3 className="font-bold text-lg flex-1">{doc.title}</h3>
                              <span className="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded ml-2">
                                {doc.type}
                              </span>
                            </div>
                            <div className="text-sm text-gray-600 space-y-1">
                              <p>{doc.council} - {doc.ministry}</p>
                              <p>{doc.date}</p>
                              {doc.summary && (
                                <p className="text-gray-500 italic mt-2">{doc.summary}</p>
                              )}
                            </div>
                          </div>
                        ))}
                        {filteredDocs.length === 0 && (
                          <div className="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                            検索条件に一致するドキュメントが見つかりませんでした
                          </div>
                        )}
                      </div>

                      <div className="lg:sticky lg:top-6 lg:self-start">
                        {selectedDoc ? (
                          <div className="bg-white rounded-lg shadow p-6">
                            <h2 className="text-xl font-bold mb-4">{selectedDoc.title}</h2>
                            <div className="space-y-3 mb-6 text-sm">
                              <div className="flex justify-between">
                                <span className="text-gray-600">会議名:</span>
                                <span className="font-medium">{selectedDoc.council}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-gray-600">省庁:</span>
                                <span className="font-medium">{selectedDoc.ministry}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-gray-600">日付:</span>
                                <span className="font-medium">{selectedDoc.date}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-gray-600">形式:</span>
                                <span className="font-medium">{selectedDoc.format}</span>
                              </div>
                              {selectedDoc.url && (
                                <div>
                                  <a
                                    href={selectedDoc.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="text-blue-600 hover:underline text-sm"
                                  >
                                    元のページを開く →
                                  </a>
                                </div>
                              )}
                            </div>

                            <div className="border-t pt-4 mb-4">
                              <h3 className="font-bold mb-2">本文</h3>
                              <p className="text-sm text-gray-700 whitespace-pre-wrap">
                                {selectedDoc.text}
                              </p>
                            </div>

                            <div className="border-t pt-4">
                              <div className="flex justify-between items-center mb-3">
                                <h3 className="font-bold">AI要約</h3>
                                <button
                                  onClick={generateSummary}
                                  disabled={isLoading}
                                  className="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 disabled:bg-gray-400"
                                >
                                  {isLoading ? (
                                    <React.Fragment>
                                      <Loader size={16} className="animate-spin" />
                                      生成中...
                                    </React.Fragment>
                                  ) : (
                                    <React.Fragment>
                                      <FileText size={16} />
                                      要約生成
                                    </React.Fragment>
                                  )}
                                </button>
                              </div>
                              {summary && (
                                <div className="bg-purple-50 p-4 rounded text-sm">
                                  {summary}
                                </div>
                              )}
                              {!summary && !isLoading && (
                                <p className="text-gray-500 text-sm">
                                  「要約生成」ボタンをクリックしてAI要約を生成します
                                </p>
                              )}
                            </div>
                          </div>
                        ) : (
                          <div className="bg-white rounded-lg shadow p-8 text-center text-gray-500">
                            <FileText size={48} className="mx-auto mb-4 text-gray-300" />
                            <p>左側のリストからドキュメントを選択してください</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </React.Fragment>
                )}
              </div>

              <footer className="bg-gray-800 text-gray-300 mt-12 py-6">
                <div className="container mx-auto px-4 text-center text-sm">
                  <p>政府IT会議ダッシュボード v2.3</p>
                  <p className="mt-2">Vercel API連携 | Webデータ自動収集 | AI要約機能搭載</p>
                </div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
